<!doctype html>
<html>
<head>
  <title>Price edge cases</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Travel Kettle",
    "offers": [
      { "@type": "Offer", "price": "49.99", "priceCurrency": "EUR" },
      { "@type": "Offer", "price": "1899", "priceCurrency": "UAH" },
      { "@type": "Offer", "price": "free", "priceCurrency": "EUR" },
      { "@type": "Offer", "price": "10.00", "priceCurrency": "€" },
      { "@type": "AggregateOffer", "lowPrice": "45.00", "highPrice": "55.00", "priceCurrency": "EUR" }
    ]
  }
  </script>
</head>
<body></body>
</html>
