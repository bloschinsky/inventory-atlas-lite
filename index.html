<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Atlas Lite</title>
    <!--
      Applies the stored or system color mode before the bundle paints, so dark mode never
      flashes light. The storage key is shared with client/src/theme.js.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('inventory-atlas-theme'); } catch (e) { /* storage can be blocked */ }
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/client/src/main.js"></script>
  </body>
</html>
